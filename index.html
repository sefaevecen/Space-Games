<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Game - Sefa Evecen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-top: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #fff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: #0a0a1a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2/3;
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            text-align: center;
        }

        .google-link {
            display: inline-block;
            margin-top: 10px;
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .google-link:hover {
            transform: translateY(-2px);
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Space Game</h1>
        <p class="subtitle">Sefa Evecen tarafından geliştirilmiştir</p>

        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="info">
            <p>SPACE tuşuna bas veya tıkla!</p>
            <a href="https://www.google.com/search?q=sefa+evecen+oyun" 
               target="_blank" 
               class="google-link">
                🔍 Google'da Ara
            </a>
        </div>
    </div>

    <script>
        // SES SİSTEMİ
        class SoundSystem {
            constructor() {
                this.audioContext = null;
                this.init();
            }

            init() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Web Audio API desteklenmiyor');
                }
            }

            playJump() {
                if (!this.audioContext) return;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, this.audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.audioContext.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                osc.start(this.audioContext.currentTime);
                osc.stop(this.audioContext.currentTime + 0.1);
            }

            playScore() {
                if (!this.audioContext) return;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.audioContext.currentTime);
                osc.frequency.setValueAtTime(1200, this.audioContext.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
                osc.start(this.audioContext.currentTime);
                osc.stop(this.audioContext.currentTime + 0.15);
            }

            playCrash() {
                if (!this.audioContext) return;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.audioContext.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                osc.start(this.audioContext.currentTime);
                osc.stop(this.audioContext.currentTime + 0.3);
            }

            resume() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sounds = new SoundSystem();

        function resize() {
            const wrapper = document.querySelector('.game-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Game {
            constructor() {
                this.state = 'start';
                this.score = 0;
                this.highScore = localStorage.getItem('flappyHigh') || 0;

                this.gravity = 0.20;
                this.jump = -4.6;
                this.maxVel = 10;

                this.bird = {
                    x: 50,
                    y: canvas.height / 2,
                    width: 34,
                    height: 24,
                    vy: 0,
                    rotation: 0
                };

                this.pipes = [];
                this.pipeWidth = 52;
                this.pipeGap = 120;
                this.pipeTimer = 0;
                this.speed = 2;

                this.stars = [];
                for(let i=0; i<50; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5
                    });
                }

                this.loop = this.loop.bind(this);
                requestAnimationFrame(this.loop);
            }

            start() {
                sounds.resume();
                this.state = 'playing';
                this.reset();
                this.flap();
            }

            restart() {
                this.state = 'playing';
                this.reset();
                this.flap();
            }

            reset() {
                this.bird.y = canvas.height / 2;
                this.bird.vy = 0;
                this.bird.rotation = 0;
                this.pipes = [];
                this.score = 0;
                this.pipeTimer = 0;
                this.speed = 2;
            }

            flap() {
                if(this.state !== 'playing') return;
                this.bird.vy = this.jump;
                sounds.playJump();
            }

            update() {
                this.stars.forEach(s => {
                    s.x -= s.speed;
                    if(s.x < 0) s.x = canvas.width;
                });

                if(this.state !== 'playing') {
                    if(this.state === 'start') {
                        this.bird.y = canvas.height/2 + Math.sin(Date.now()/300)*10;
                    }
                    return;
                }

                this.bird.vy += this.gravity;
                if(this.bird.vy > this.maxVel) this.bird.vy = this.maxVel;
                this.bird.y += this.bird.vy;

                if(this.bird.vy < 0) this.bird.rotation = -25;
                else {
                    this.bird.rotation += 2;
                    if(this.bird.rotation > 90) this.bird.rotation = 90;
                }

                if(this.bird.y < 0) {
                    this.bird.y = 0;
                    this.bird.vy = 0;
                }
                if(this.bird.y + this.bird.height > canvas.height) {
                    this.bird.y = canvas.height - this.bird.height;
                    this.bird.vy = 0;
                }

                this.pipeTimer++;
                if(this.pipeTimer > 100) {
                    this.spawnPipe();
                    this.pipeTimer = 0;
                }

                for(let i = this.pipes.length-1; i >= 0; i--) {
                    let p = this.pipes[i];
                    p.x -= this.speed;

                    if(!p.passed && p.x + p.w < this.bird.x) {
                        p.passed = true;
                        if(p.type === 'top') {
                            this.score++;
                            sounds.playScore();
                            if(this.score % 10 === 0) this.speed += 0.5;
                        }
                    }

                    if(this.checkCollision(this.bird, p)) {
                        this.gameOver();
                    }

                    if(p.x + p.w < -100) this.pipes.splice(i, 1);
                }
            }

            spawnPipe() {
                let minH = 50;
                let maxH = canvas.height - this.pipeGap - minH;
                let topH = Math.random() * (maxH - minH) + minH;

                this.pipes.push({
                    x: canvas.width,
                    y: 0,
                    w: this.pipeWidth,
                    h: topH,
                    type: 'top',
                    passed: false
                });

                this.pipes.push({
                    x: canvas.width,
                    y: topH + this.pipeGap,
                    w: this.pipeWidth,
                    h: canvas.height - topH - this.pipeGap,
                    type: 'bottom',
                    passed: false
                });
            }

            checkCollision(bird, pipe) {
                let bx = bird.x + 5;
                let by = bird.y + 5;
                let bw = bird.width - 10;
                let bh = bird.height - 10;

                return bx < pipe.x + pipe.w &&
                       bx + bw > pipe.x &&
                       by < pipe.y + pipe.h &&
                       by + bh > pipe.y;
            }

            gameOver() {
                this.state = 'over';
                sounds.playCrash();
                if(this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('flappyHigh', this.highScore);
                }
                setTimeout(() => {
                    if(confirm('Oyun Bitti! Skor: ' + this.score + '\nTekrar oyna?')) {
                        this.restart();
                    } else {
                        this.state = 'start';
                    }
                }, 100);
            }

            draw() {
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#fff';
                this.stars.forEach(s => {
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                this.pipes.forEach(p => {
                    let grad = ctx.createLinearGradient(p.x, 0, p.x+p.w, 0);
                    grad.addColorStop(0, '#f0f');
                    grad.addColorStop(0.5, '#90f');
                    grad.addColorStop(1, '#f0f');

                    ctx.fillStyle = grad;
                    ctx.fillRect(p.x, p.y, p.w, p.h);

                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                });

                if(this.state !== 'over') {
                    ctx.save();
                    ctx.translate(this.bird.x + this.bird.width/2, this.bird.y + this.bird.height/2);
                    ctx.rotate(this.bird.rotation * Math.PI/180);

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0ff';

                    ctx.fillStyle = '#0ff';
                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(-8, -8);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(-8, 8);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#f60';
                    ctx.beginPath();
                    ctx.moveTo(-6, -3);
                    ctx.lineTo(-12 - Math.random()*4, 0);
                    ctx.lineTo(-6, 3);
                    ctx.fill();

                    ctx.restore();
                }

                // Skor
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.score, canvas.width/2, 40);
                ctx.font = '12px Arial';
                ctx.fillText('Rekor: ' + this.highScore, canvas.width/2, 60);

                // Başlangıç mesajı
                if(this.state === 'start') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0ff';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('FLAPPY SPACE', canvas.width/2, canvas.height/2 - 30);
                    ctx.font = '14px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.fillText('SPACE veya TIKLA', canvas.width/2, canvas.height/2 + 20);
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(this.loop);
            }
        }

        const game = new Game();

        function handleInput(e) {
            e.preventDefault();
            if(game.state === 'start') game.start();
            else if(game.state === 'over') game.restart();
            else game.flap();
        }

        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                e.preventDefault();
                handleInput(e);
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, {passive: false});
    </script>
</body>
</html>
